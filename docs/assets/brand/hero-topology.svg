<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">All in Luna task topology</title>
  <desc id="desc">A clean main conversation feeds a global coordinator, which creates independent top-level task lanes. Each lane contains local work and returns typed results.</desc>
  <defs>
    <linearGradient id="lane1" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#7C9CFF"/></linearGradient>
    <linearGradient id="lane2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C9CFF"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <style>
      .bg{fill:#0B1020}.panel{fill:#111827;stroke:#243047;stroke-width:1.5}.muted{fill:#94A3B8}.text{fill:#F8FAFC;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.small{font-size:16px}.label{font-size:18px;font-weight:650}.title{font-size:28px;font-weight:750}.line{fill:none;stroke:#334155;stroke-width:2.5}.dot{fill:#7C9CFF}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="28"/>
  <text class="text title" x="60" y="64">Parallel across tasks. Recursive inside tasks.</text>
  <text class="text small muted" x="60" y="94">Keep the main conversation clean while each task owns its local context and workers.</text>

  <rect class="panel" x="60" y="132" width="220" height="82" rx="18"/>
  <text class="text label" x="86" y="166">Main conversation</text>
  <text class="text small muted" x="86" y="193">goal · progress · decisions</text>

  <path class="line" d="M280 173H360"/>
  <circle class="dot" cx="320" cy="173" r="5"/>

  <rect class="panel" x="360" y="132" width="220" height="82" rx="18"/>
  <text class="text label" x="386" y="166">Global Coordinator</text>
  <text class="text small muted" x="386" y="193">dependencies · scheduling</text>

  <path class="line" d="M580 173H642"/>
  <path class="line" d="M642 173V294"/>
  <path class="line" d="M642 173V414"/>

  <g>
    <rect class="panel" x="682" y="116" width="454" height="102" rx="20"/>
    <rect x="682" y="116" width="8" height="102" rx="4" fill="#67E8F9"/>
    <text class="text label" x="716" y="151">Task A · Backend</text>
    <text class="text small muted" x="716" y="178">own context</text>
    <circle cx="858" cy="174" r="6" fill="#67E8F9"/><text class="text small muted" x="874" y="180">API</text>
    <circle cx="950" cy="174" r="6" fill="#67E8F9"/><text class="text small muted" x="966" y="180">tests</text>
    <circle cx="1045" cy="174" r="6" fill="#67E8F9"/><text class="text small muted" x="1061" y="180">worker</text>
  </g>

  <g>
    <rect class="panel" x="682" y="248" width="454" height="102" rx="20"/>
    <rect x="682" y="248" width="8" height="102" rx="4" fill="#7C9CFF"/>
    <text class="text label" x="716" y="283">Task B · Frontend</text>
    <text class="text small muted" x="716" y="310">own context</text>
    <circle cx="858" cy="306" r="6" fill="#7C9CFF"/><text class="text small muted" x="874" y="312">UI</text>
    <circle cx="950" cy="306" r="6" fill="#7C9CFF"/><text class="text small muted" x="966" y="312">routes</text>
    <circle cx="1045" cy="306" r="6" fill="#7C9CFF"/><text class="text small muted" x="1061" y="312">worker</text>
  </g>

  <g>
    <rect class="panel" x="682" y="380" width="454" height="102" rx="20"/>
    <rect x="682" y="380" width="8" height="102" rx="4" fill="#A78BFA"/>
    <text class="text label" x="716" y="415">Task C · Integration</text>
    <text class="text small muted" x="716" y="442">waits only for real dependencies</text>
    <circle cx="1016" cy="438" r="6" fill="#A78BFA"/><text class="text small muted" x="1032" y="444">verify</text>
  </g>

  <path d="M642 173H682" stroke="url(#lane1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M642 294H682" stroke="url(#lane1)" stroke-width="5" stroke-linecap="round"/>
  <path d="M642 414H682" stroke="url(#lane2)" stroke-width="5" stroke-linecap="round"/>

  <text class="text small muted" x="60" y="522">Strong reasoning gets a narrower objective. Local tool noise stays local. Results move upward, not entire transcripts.</text>
</svg>
