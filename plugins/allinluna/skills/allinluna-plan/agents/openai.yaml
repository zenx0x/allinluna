interface:
  display_name: "All in Luna — 规划"
  short_description: "规划完整开发，或把现有计划转换为高并发顶层任务"
  default_prompt: "使用 $allinluna-plan：用户主对话作为 Sponsor，规划独立 Coordinator 与侧边栏可见的顶层 Codex 任务 Owner dependency waves。保留稳定 task id、worktree 隔离、模型/reasoning/并发、resume、用户自带计划和 Research Routes；quick 为默认路径，full 需显式升级；lean runtime 不物化 CounterPilot 或 Acceptance lane。支持 managed 或 parallel-only、8/12/16/24/48/64、fast 与 ultra-fast；16+ 时询问一次高质量模型检查并发拆解。"
