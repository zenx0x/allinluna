name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run full pytest suite
        run: python -m pytest tests -q
      - name: Run vNext suite validator
        run: python scripts/validate_vnext_tests.py --run --performance --json
      - name: Validate plugin repository
        run: python scripts/validate_repository.py
      - name: Validate Core Slim ownership
        run: python scripts/validate_core_slim.py
      - name: Validate installed plugin Skills
        run: python scripts/validate_installations.py
