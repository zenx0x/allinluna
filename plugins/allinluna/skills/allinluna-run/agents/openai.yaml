interface:
  display_name: "All in Luna — 执行"
  short_description: "由独立协调器、子协调和 CounterPilot 并发执行计划"
  default_prompt: "使用 $allinluna-run 完整执行：当前用户对话仅作 Sponsor，立即创建独立顶层 Coordinator，并按策略创建 CounterPilot；由 Coordinator 派发侧边栏可见的顶层 Codex 任务，高并发时创建子协调分片。可直接用 parallel-only 执行用户已有计划；持续派发、监控和返修直到停止边界，不创建 Goal。"
