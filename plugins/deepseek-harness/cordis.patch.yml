# Bundle default for repository development. Public users should run
# `npx @zenx0x/allinflash init`, which writes a deployment-specific override.
- insert:
    - id: allinflash
      name: '@zenx0x/allinflash'
      config:
        # Point to the installed All in Luna command.  For this repository:
        command: uv
        commandArgs: ['run', 'allinluna', '--adapter', 'deepseek-harness']
        # db: 'D:/AgentSkills/allinluna/runtime.db'
        cwd: 'D:/AgentSkills/allinluna'
        timeoutMs: 30000
        model: deepseek-v4-flash
        subagentProvider: spawn
