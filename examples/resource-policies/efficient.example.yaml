  work.implementation:
    model: "${FAST_MODEL}"
    reasoning: "${BALANCED_REASONING}"
  work.deep-debug:
    model: "${STRONG_MODEL}"
    reasoning: "${HIGH_REASONING}"
  verify.independent:
    model: "${VERIFY_MODEL}"
    reasoning: "${HIGH_REASONING}"
