# Add this row to a DSH profile's cordis.patch.yml after installing
# @zenx0x/allinflash into that profile.
- insert:
    - id: allinflash
      name: '@zenx0x/allinflash'
      config:
        # Point to the installed All in Luna command.  For this repository:
        command: uv
        commandArgs: ['run', 'allinluna', '--adapter', 'deepseek-harness']
        # db: 'D:/AgentSkills/allinluna/runtime.db'
        cwd: 'D:/AgentSkills/allinluna'
        timeoutMs: 30000
        model: deepseek-v4-flash
        subagentProvider: spawn
