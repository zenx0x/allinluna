<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">All in Luna mark</title>
  <desc id="desc">A central task line splitting into three orbital task lanes and converging again.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.52" stop-color="#7C9CFF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#0B1020"/>
  <circle cx="128" cy="128" r="76" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="128" cy="128" r="52" fill="none" stroke="#172033" stroke-width="2" stroke-dasharray="4 8"/>
  <path d="M128 38V78" stroke="url(#g)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M128 78C128 98 72 98 72 128S128 158 128 178" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  <path d="M128 78V178" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  <path d="M128 78C128 98 184 98 184 128S128 158 128 178" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round"/>
  <path d="M128 178V218" stroke="url(#g)" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="72" cy="128" r="8" fill="#67E8F9"/>
  <circle cx="128" cy="128" r="8" fill="#7C9CFF"/>
  <circle cx="184" cy="128" r="8" fill="#A78BFA"/>
</svg>
